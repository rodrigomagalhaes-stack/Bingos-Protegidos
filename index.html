<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Cadastro de Bingos Protegidos</title>
<style>
  /* As mesmas variáveis do portal, para as duas telas parecerem a mesma casa.
     Copiadas, e não importadas: este projeto sobe sozinho na Vercel e não pode
     depender de um arquivo que vive no outro. */
  :root {
    --bg: #f6f5f3;
    --surface: #ffffff;
    --surface-2: #f1efec;
    --linha: rgba(20, 18, 16, .10);
    --t1: #221f1c;
    --t2: #5a5551;
    --t3: #6e6a66;
    --acc: #ff3d00;
    --acc-2: #e03400;
    --verde: #15803d;
    --verde-soft: rgba(21, 128, 61, .09);
    --vermelho: #dc2626;
    --vermelho-soft: rgba(220, 38, 38, .09);
    --sombra: 0 14px 30px -16px rgba(20, 18, 16, .18);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121314;
      --surface: #1a1c1e;
      --surface-2: #212325;
      --linha: rgba(255, 255, 255, .09);
      --t1: #f5f4f1;
      --t2: #a3a8a8;
      --t3: #8a9091;
      --acc: #ff3d00;
      --acc-2: #ff5c26;
      --verde: #3ecf98;
      --verde-soft: rgba(62, 207, 152, .13);
      --vermelho: #ff5470;
      --vermelho-soft: rgba(255, 84, 112, .13);
      --sombra: 0 14px 30px -16px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 20px 60px;
    background: var(--bg);
    color: var(--t1);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .caixa { max-width: 440px; margin: 0 auto; }

  .marca {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 22px;
  }

  .marca b {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: var(--acc);
    color: #fff;
    font-size: 13px;
  }

  .marca span { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }

  h1 { margin: 0 0 22px; font-size: 20px; letter-spacing: -0.4px; }

  .cartao {
    padding: 20px;
    border: 1px solid var(--linha);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--sombra);
  }

  label { display: block; margin-bottom: 14px; }

  label > span {
    display: block;
    margin-bottom: 5px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--t3);
  }

  input {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--linha);
    border-radius: 9px;
    background: var(--surface-2);
    color: var(--t1);
    font-family: inherit;
    font-size: 14px;
  }

  input:focus { outline: 2px solid var(--acc); outline-offset: -1px; }

  .so-rotulo, .so-rotulo > span { margin-bottom: 0; }

  .dica { margin: 0 0 9px; font-size: 11.5px; color: var(--t3); }

  button {
    padding: 10px 16px;
    border: 1px solid var(--linha);
    border-radius: 9px;
    background: var(--surface-2);
    color: var(--t1);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover:not(:disabled) { border-color: var(--t3); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  button.primario { border-color: transparent; background: var(--acc); color: #fff; }
  button.primario:hover:not(:disabled) { background: var(--acc-2); }

  .datas { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px 5px 11px;
    border-radius: 999px;
    background: var(--surface-2);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }

  .chip button {
    padding: 0 3px;
    border: 0;
    background: none;
    color: var(--t3);
    font-size: 15px;
    line-height: 1;
  }

  .linha-data { display: flex; gap: 8px; }
  .linha-data input { flex: 1; }

  .pe {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--linha);
  }

  .recado {
    margin: 0 0 14px;
    padding: 10px 12px;
    border-radius: 9px;
    font-size: 12.5px;
    line-height: 1.5;
  }

  .recado.erro { background: var(--vermelho-soft); color: var(--vermelho); }

  .oculto { display: none !important; }

  .fim { text-align: center; padding: 12px 0 4px; }
  .fim p { margin: 0 0 18px; font-size: 14px; color: var(--t2); }
  .fim strong { color: var(--t1); }
</style>
</head>
<body>

<div class="caixa">
  <div class="marca"><b>E</b><span>Esportiva Bet</span></div>

  <h1>Bingos Protegidos</h1>
  <form class="cartao" id="form">
    <label>
      <span>Nome do tipster</span>
      <input type="text" id="tipster" autocomplete="off" required />
    </label>

    <label>
      <span>Stake do bilhete (R$)</span>
      <input type="number" id="stake" min="0.01" step="0.01" required />
    </label>

    <label>
      <span>Link do bilhete</span>
      <input type="url" id="link" placeholder="https://…" required />
    </label>

    <label class="so-rotulo"><span>Datas dos confrontos</span></label>
    <p class="dica">A data que os confrontos ocorreram</p>
    <div class="datas" id="chips"></div>
    <div class="linha-data">
      <input type="date" id="data" />
      <button type="button" id="btn-data">Acrescentar</button>
    </div>

    <p class="recado erro oculto" id="erro"></p>

    <div class="pe">
      <button type="submit" class="primario" id="btn-salvar">Cadastrar bilhete</button>
    </div>
  </form>

  <div class="cartao oculto" id="pronto">
    <div class="fim">
      <p>Bilhete cadastrado. Ele entra na fila do BI quando <strong id="quando"></strong>.</p>
      <button type="button" class="primario" id="btn-outro">Cadastrar outro</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const form = $('form')
const pronto = $('pronto')

let datas = []

const mostrar = (el) => el.classList.remove('oculto')
const esconder = (el) => el.classList.add('oculto')

function recado(el, texto) {
  if (!texto) return esconder(el)
  el.textContent = texto
  mostrar(el)
}

const formatar = (iso) => iso.split('-').reverse().join('/')

function desenharChips() {
  $('chips').innerHTML = ''
  for (const d of datas) {
    const chip = document.createElement('span')
    chip.className = 'chip'
    chip.textContent = formatar(d)

    const x = document.createElement('button')
    x.type = 'button'
    x.textContent = '×'
    x.title = 'tirar esta data'
    x.onclick = () => {
      datas = datas.filter((v) => v !== d)
      desenharChips()
    }

    chip.appendChild(x)
    $('chips').appendChild(chip)
  }
}

$('btn-data').onclick = () => {
  const v = $('data').value
  if (!v) return
  if (!datas.includes(v)) datas.push(v)
  datas.sort()
  $('data').value = ''
  desenharChips()
}

form.onsubmit = async (e) => {
  e.preventDefault()
  recado($('erro'), '')

  if (!datas.length) {
    return recado($('erro'), 'Acrescente ao menos uma data de confronto.')
  }

  const btn = $('btn-salvar')
  btn.disabled = true
  btn.textContent = 'Cadastrando…'

  try {
    const res = await fetch('/api/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tipster_nome: $('tipster').value,
        stake: Number($('stake').value),
        link_bilhete: $('link').value,
        datas_confrontos: datas,
      }),
    })
    const dados = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(dados.erro || 'Deu erro aqui. Tente de novo.')

    $('quando').textContent = 'o jogo de ' + formatar(datas[datas.length - 1]) + ' terminar'
    esconder(form)
    mostrar(pronto)
  } catch (err) {
    recado($('erro'), err.message)
  } finally {
    btn.disabled = false
    btn.textContent = 'Cadastrar bilhete'
  }
}

$('btn-outro').onclick = () => {
  // Guarda o tipster: são dez bilhetes seguidos do mesmo, e redigitar o nome a
  // cada um é onde a grafia começa a variar.
  const tipster = $('tipster').value
  form.reset()
  $('tipster').value = tipster
  datas = []
  desenharChips()
  recado($('erro'), '')
  esconder(pronto)
  mostrar(form)
}
</script>

</body>
</html>
